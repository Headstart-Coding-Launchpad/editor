<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scratch render</title>
    <!-- Same block font as the app (src/index.css): Quicksand 600 on .blocklyText. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&display=block"
    />
    <style>
      body {
        margin: 0;
        background: #fff;
      }
      #blocks {
        width: 2400px;
        height: 2400px;
      }
      /* Copied from src/index.css (.scratch-workspace rules) so blocks look as they do in a lesson. */
      .scratch-workspace .blocklyText {
        font-family: 'Quicksand', sans-serif;
        font-weight: 600;
      }
      .scratch-workspace .blocklyPath {
        filter: drop-shadow(0 2px 0 rgba(58, 59, 60, 0.14));
      }
      .scratch-workspace .blocklyMainBackground {
        fill: transparent;
        stroke: none;
      }
    </style>
  </head>
  <body>
    <div id="blocks" class="scratch-workspace"></div>
    <script type="module" src="./page.js"></script>
  </body>
</html>
