name: CI

# Runs on pull requests and on every push to main. Branches merged locally and
# pushed straight to main still get checked. A green run on main triggers the
# Pages deploy (deploy.yml).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build number is the commit count (scripts/build-info.mjs).
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Check documentation
        run: npm run docs:check

      # Fails on lint errors only. Existing warnings are reported but don't block.
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Production build, so a PR can't pass CI and then break the deploy (Rollup rejects a
      # missing named export that Vitest resolves to undefined). Runs vite directly to skip the
      # `prebuild` test run, which the test jobs already cover.
      - name: Build
        run: npx vite build

  # The suite is split across parallel runners. Each shard writes a blob report with its
  # coverage, and the coverage job merges them and applies the thresholds.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Test shard ${{ matrix.shard }}/4
        run: npx vitest run --shard=${{ matrix.shard }}/4 --reporter=default --reporter=blob --coverage --coverage.reporter=text-summary
        env:
          VITEST_COVERAGE_SHARD: '1'

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  coverage:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: .vitest-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports and check coverage thresholds
        run: npx vitest --merge-reports --coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # Security rules for Realtime Database, Firestore and Storage, tested against the
  # emulators using the real rules files. Separate job because it needs Java.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15

      - name: Test security rules
        run: npm run test:rules
